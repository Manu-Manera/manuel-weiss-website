<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeiteintrag</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 24px auto; padding: 0 16px; line-height: 1.4; }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    .meta { color: #666; margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    textarea, input[type=number], select { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font: inherit; }
    textarea { min-height: 88px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { border: 1px solid #bbb; background: #f4f4f4; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 0.9rem; }
    .chip.on { background: #1f4e79; color: #fff; border-color: #1f4e79; }
    .preview { background: #f6f7f9; border-radius: 8px; padding: 12px; margin-top: 16px; }
    .actions { display: flex; gap: 8px; margin-top: 18px; }
    button { flex: 1; padding: 12px; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
    .save { background: #1f4e79; color: #fff; }
    .discard { background: #eee; }
    .ok { color: #0a7; font-weight: 600; }
    .err { color: #c00; }
  </style>
</head>
<body>
  <h1>Zeiteintrag anpassen</h1>
  <p class="meta" id="meta">Lade Vorschlag…</p>

  <label for="title">Text im Excel</label>
  <textarea id="title" placeholder="z. B. Statuscall MN+MW inkl. Vorbereitung"></textarea>
  <div class="row" id="initials"></div>

  <label for="hours">Stunden</label>
  <input id="hours" type="number" min="0.25" step="0.25">
  <div class="row" id="extras"></div>

  <label for="customer">Excel / Kunde</label>
  <select id="customer"></select>

  <div class="preview">
    <strong>Vorschau</strong>
    <div id="preview"></div>
  </div>

  <div class="actions">
    <button class="save" id="save">Speichern</button>
    <button class="discard" id="discard" type="button">Verwerfen</button>
  </div>
  <p id="status"></p>

  <script>
    const API = 'https://bs9hmd2jp8.execute-api.eu-central-1.amazonaws.com/prod';
    const id = new URLSearchParams(location.search).get('id');
    const initials = ['MW', 'MN+MW', 'AS+MW'];
    const extras = [
      { key: 'prep25', label: '+15min Vorbereitung', hours: 0.25, text: 'inkl. Vorbereitung' },
      { key: 'prep50', label: '+30min Vorbereitung', hours: 0.5, text: 'inkl. Vorbereitung' },
      { key: 'wrap25', label: '+15min Nachbereitung', hours: 0.25, text: 'inkl. Nachbereitung' },
      { key: 'wrap50', label: '+30min Nachbereitung', hours: 0.5, text: 'inkl. Nachbereitung' }
    ];
    const sheets = [
      { customer: 'Cistec', label: 'TimeSheet Cistec' },
      { customer: 'SHS', label: 'TimeSheet Siemens Healthcare' },
      { customer: 'Horizon', label: 'Horizon' },
      { customer: 'Knauf', label: 'Knauf' },
      { customer: 'HR Campus', label: 'HR Campus' },
      { customer: 'Intern', label: 'Intern / Valkeen' }
    ];
    const state = { initial: 'MW', extras: new Set() };

    function $(id) { return document.getElementById(id); }
    function renderChips() {
      $('initials').innerHTML = initials.map((n) =>
        `<span class="chip${state.initial===n?' on':''}" data-i="${n}">${n}</span>`
      ).join('');
      $('extras').innerHTML = extras.map((e) =>
        `<span class="chip${state.extras.has(e.key)?' on':''}" data-e="${e.key}">${e.label}</span>`
      ).join('');
    }
    function builtTitle() {
      let t = $('title').value.trim();
      if (state.initial && !t.includes(state.initial)) t = `${t} ${state.initial}`.trim();
      for (const e of extras) {
        if (state.extras.has(e.key) && !t.toLowerCase().includes(e.text.toLowerCase())) t += ` ${e.text}`;
      }
      return t.replace(/\s+/g, ' ').trim();
    }
    function extraHours() {
      return extras.filter((e) => state.extras.has(e.key)).reduce((s, e) => s + e.hours, 0);
    }
    function preview() {
      const hours = Math.max(0.25, (Number($('hours').value) || 0) + extraHours());
      const customer = $('customer').value;
      const sheet = sheets.find((s) => s.customer === customer);
      $('preview').textContent = `${hours}h · ${sheet ? sheet.label : customer}\n${builtTitle()}`;
    }
    async function api(path, opts) {
      const res = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Fehler');
      return data;
    }
    $('initials').addEventListener('click', (ev) => {
      const n = ev.target.dataset.i;
      if (!n) return;
      state.initial = n;
      renderChips(); preview();
    });
    $('extras').addEventListener('click', (ev) => {
      const k = ev.target.dataset.e;
      if (!k) return;
      if (k.startsWith('prep')) { state.extras.delete('prep25'); state.extras.delete('prep50'); }
      if (k.startsWith('wrap')) { state.extras.delete('wrap25'); state.extras.delete('wrap50'); }
      if (state.extras.has(k)) state.extras.delete(k); else state.extras.add(k);
      renderChips(); preview();
    });
    $('title').addEventListener('input', preview);
    $('hours').addEventListener('input', preview);
    $('customer').addEventListener('change', preview);

    $('save').onclick = async () => {
      $('status').textContent = 'Speichere…';
      try {
        await api('/eintrag', {
          method: 'POST',
          body: JSON.stringify({
            id,
            action: 'save',
            title: builtTitle(),
            hours: Math.max(0.25, (Number($('hours').value) || 0) + extraHours()),
            customer: $('customer').value
          })
        });
        $('status').className = 'ok';
        $('status').textContent = 'Gespeichert. Excel-Sync in 1–2 Minuten.';
      } catch (e) {
        $('status').className = 'err';
        $('status').textContent = e.message;
      }
    };
    $('discard').onclick = async () => {
      try {
        await api('/eintrag', { method: 'POST', body: JSON.stringify({ id, action: 'discard' }) });
        $('status').className = 'ok';
        $('status').textContent = 'Verworfen.';
      } catch (e) {
        $('status').className = 'err';
        $('status').textContent = e.message;
      }
    };

    (async () => {
      if (!id) { $('meta').textContent = 'Kein Eintrag angegeben.'; return; }
      $('customer').innerHTML = sheets.map((s) => `<option value="${s.customer}">${s.label}</option>`).join('');
      renderChips();
      const p = await api('/eintrag?id=' + encodeURIComponent(id));
      $('title').value = p.title || '';
      $('hours').value = p.hours || 1;
      if (p.customer) $('customer').value = p.customer;
      $('meta').textContent = p.start && p.end ? `${p.start}–${p.end}` : '';
      preview();
    })().catch((e) => { $('meta').textContent = e.message; });
  </script>
</body>
</html>
