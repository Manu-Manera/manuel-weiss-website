    <script>
      document.addEventListener('DOMContentLoaded', function () {
        // Mobile-Menü
        const mh = document.getElementById('mobileHamburger');
        const mo = document.getElementById('mobileMenuOverlay');
        const mf = document.getElementById('mobileMenuFullscreen');
        function toggle() {
          mo?.classList.toggle('active');
          mf?.classList.toggle('active');
          document.body.style.overflow = mf?.classList.contains('active') ? 'hidden' : '';
        }
        mh?.addEventListener('click', toggle);
        mo?.addEventListener('click', toggle);
        mf?.querySelectorAll('.mobile-menu-link').forEach(l => l.addEventListener('click', toggle));

        // Auth-Button
        const authButton = document.getElementById('authButton');
        const mobileAuthButton = document.getElementById('mobileAuthButton');
        const logoutBtn = document.getElementById('logoutBtn');

        function showLoginModal() {
          if (window.authModals?.showLogin) return window.authModals.showLogin();
          if (window.awsAuth?.showLoginModal) return window.awsAuth.showLoginModal();
        }

        authButton?.addEventListener('click', (e) => {
          if (!e.isTrusted) return;
          if (authButton.classList.contains('logged-in')) return;
          e.preventDefault();
          e.stopPropagation();
          showLoginModal();
        });
        mobileAuthButton?.addEventListener('click', () => {
          if (mobileAuthButton.classList.contains('logged-in')) return;
          toggle();
          showLoginModal();
        });

        function updateAuthUI() {
          const isLoggedIn = (window.realUserAuth?.isLoggedIn?.() || window.awsAuth?.isLoggedIn?.()) || false;
          if (isLoggedIn) {
            const u = window.realUserAuth?.getCurrentUser?.() || window.awsAuth?.getCurrentUser?.() || {};
            const name = (u.name && u.name !== 'Test User') ? u.name
              : (u.email ? String(u.email).split('@')[0] : 'Profil');
            if (authButton) {
              authButton.classList.add('logged-in');
              authButton.innerHTML = '<i class="fas fa-user-check"></i> <span>' + name + '</span>';
            }
            if (mobileAuthButton) {
              mobileAuthButton.classList.add('logged-in');
              mobileAuthButton.innerHTML = '<i class="fas fa-user-check"></i> <span>' + name + '</span>';
            }
          } else {
            if (authButton) {
              authButton.classList.remove('logged-in');
              authButton.innerHTML = '<i class="fas fa-user"></i> <span>Anmelden</span>';
            }
            if (mobileAuthButton) {
              mobileAuthButton.classList.remove('logged-in');
              mobileAuthButton.innerHTML = '<i class="fas fa-user"></i> <span>Anmelden</span>';
            }
            if (window.UserDropdownController) window.UserDropdownController.closeAll();
          }
        }

        logoutBtn?.addEventListener('click', async () => {
          try { await (window.realUserAuth?.logout?.() || window.awsAuth?.logout?.()); } catch (_e) {}
          localStorage.removeItem('aws_auth_session');
          localStorage.removeItem('awsUserSession');
          localStorage.removeItem('awsAuthTokens');
          if (window.UserDropdownController) window.UserDropdownController.closeAll();
          window.location.reload();
        });

        updateAuthUI();
        setTimeout(updateAuthUI, 1200);
        window.addEventListener('userLoggedIn', () => {
          updateAuthUI();
          window.location.reload();
        });

        // Studio initialisieren
        try {
          window.musicStudio = new MusicStudio('musicStudioRoot');
        } catch (err) {
          console.error('MusicStudio init failed:', err);
          const root = document.getElementById('musicStudioRoot');
          if (root) {
            root.innerHTML = '<div class="ms-empty ms-empty-center"><h2>Fehler beim Laden</h2><p>' +
              (err.message || err) + '</p></div>';
          }
        }
      });
    </script>
